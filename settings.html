<div class="yodayo-tavern-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Yodayo Tavern Theme</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="yt_enabled">
                <input id="yt_enabled" type="checkbox" />
                <span>Enable theme</span>
            </label>

            <label class="checkbox_label" for="yt_pause_user_theme" title="Turns off SillyTavern's own Custom CSS and UI theme preset (chat style, avatar shape, Visual Novel mode) while this theme is on, without changing them. Off by default, since this theme builds on SillyTavern's chat styles.">
                <input id="yt_pause_user_theme" type="checkbox" />
                <span>Pause my Custom CSS and UI theme</span>
            </label>

            <div id="yt_customize" class="menu_button menu_button_icon yt-customize-open" title="Change every part of the theme, with a live preview">
                <i class="fa-solid fa-palette"></i>
                <span>Customize everything…</span>
            </div>

            <div class="yt-setting-row">
                <label for="yt_accent">Accent color</label>
                <input id="yt_accent" type="color" />
                <div id="yt_accent_reset" class="menu_button menu_button_icon fa-solid fa-rotate-left" title="Reset to Yodayo pink"></div>
            </div>

            <div class="yt-setting-row">
                <label for="yt_user_side">Your messages</label>
                <select id="yt_user_side" class="text_pole">
                    <option value="right">On the right</option>
                    <option value="left">On the left</option>
                </select>
            </div>

            <div class="yt-setting-row">
                <label for="yt_font">Font</label>
                <select id="yt_font" class="text_pole">
                    <option value="inter">Inter (falls back to system)</option>
                    <option value="system">System UI</option>
                    <option value="default">SillyTavern default</option>
                </select>
            </div>

            <div class="yt-setting-row">
                <label for="yt_bubble_width">Bubble max width</label>
                <input id="yt_bubble_width" type="range" min="480" max="1200" step="20" />
                <span id="yt_bubble_width_value" class="yt-muted"></span>
            </div>

            <div class="yt-setting-row">
                <label for="yt_nav_position">Menu bar position</label>
                <select id="yt_nav_position" class="text_pole">
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                </select>
            </div>

            <div class="yt-setting-row">
                <label for="yt_nav_trigger">Show menu bar</label>
                <select id="yt_nav_trigger" class="text_pole">
                    <option value="always">Always</option>
                    <option value="menu">With the menu button</option>
                    <option value="arrow">With an arrow tab on its edge</option>
                    <option value="autohide">On hover at its edge (auto-hide)</option>
                </select>
            </div>

            <div class="yt-setting-row">
                <label for="yt_nav_shortcut">Menu bar shortcut</label>
                <input id="yt_nav_shortcut" class="text_pole" type="text" placeholder="e.g. Alt+M" spellcheck="false" />
            </div>

            <div class="yt-setting-row">
                <label for="yt_phone_nav">Menu bar on phones</label>
                <select id="yt_phone_nav" class="text_pole">
                    <option value="bottom">Bottom</option>
                    <option value="top">Top</option>
                </select>
            </div>


            <div class="yt-setting-row">
                <label for="yt_panel_opacity">Bubble opacity</label>
                <input id="yt_panel_opacity" type="range" min="40" max="100" step="5" />
                <span id="yt_panel_opacity_value" class="yt-muted"></span>
            </div>

            <div class="yt-setting-row">
                <label for="yt_chat_position">Chat position</label>
                <select id="yt_chat_position" class="text_pole">
                    <option value="left">Left</option>
                    <option value="middle">Middle</option>
                    <option value="right">Right</option>
                </select>
            </div>

            <label class="checkbox_label" for="yt_character_art">
                <input id="yt_character_art" type="checkbox" />
                <span>Show character image on the free side (left/right positions)</span>
            </label>

            <label class="checkbox_label" for="yt_tavern_home">
                <input id="yt_tavern_home" type="checkbox" />
                <span>Tavern home page (character grid on the welcome screen)</span>
            </label>

            <label class="checkbox_label" for="yt_flat_bg">
                <input id="yt_flat_bg" type="checkbox" />
                <span>Hide chat background image (flat Yodayo look)</span>
            </label>

            <h4 class="yt-section-title">Colors</h4>

            <div class="yt-setting-row">
                <label for="yt_color_scope">Apply to</label>
                <select id="yt_color_scope" class="text_pole">
                    <option value="all">All characters</option>
                    <option value="character">Only this character</option>
                </select>
            </div>

            <div id="yt_color_rows"></div>

            <div id="yt_char_image_row" class="yt-setting-row displayNone">
                <label for="yt_char_image">Character image</label>
                <input id="yt_char_image" class="text_pole" type="url" placeholder="Image URL (blank uses the card)" />
            </div>

            <div class="yt-setting-row">
                <div id="yt_colors_reset" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Reset these colors</span>
                </div>
            </div>

            <h4 class="yt-section-title">Advanced</h4>
            <div id="yt_advanced"></div>

            <h4 class="yt-section-title">Backup</h4>

            <div class="yt-setting-row">
                <div id="yt_export" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Export</span>
                </div>
                <div id="yt_import" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Import</span>
                </div>
                <input id="yt_import_file" type="file" accept="application/json,.json" hidden />
            </div>

            <div class="yt-setting-row">
                <div id="yt_reset_all" class="menu_button menu_button_icon caution">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Reset everything to defaults</span>
                </div>
            </div>

            <small id="yt_conflict_note" class="yt-muted displayNone">
                Moonlit Echoes is enabled and overrides the chat layout. Disable it in Manage Extensions for the full Yodayo look.
            </small>
        </div>
    </div>
</div>
